<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7cc8f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="쉐입프루츠">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<title>쉐입 프루츠</title>
<style>
/* 색은 모두 테마 변수. 기본값은 '과일 농장' 테마이고, 다른 테마는 JS 가 덮어쓴다. */
:root{--ink:#5a3d22;--c1:#fffdf7;--c2:#fbeed6;--csh:#d6a46a;--frame:#e8b06a;--frame-d:#b0713a;--cream:#fffaf0;
  --a1:#7ad66a;--a2:#4fb03f;--ash:#3a8a2e;--sub:#9a7550;--h1:#ffe3a6;--h2:#ffd88a;--hline:#f0c070;--label:#b47a3c;
  --num:#ff7a45;--numsh:#ffe1b0;--page:#c4ebff;--toast:rgba(90,61,34,.92);--pink:#ff8fb1;
  --gap:48px; /* 하단 로고·툴바에 가리지 않도록 버튼을 띄우는 여백 */
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;font-family:var(--font);color:var(--ink);background:var(--page);
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;transition:opacity .35s}
#bg.fade{opacity:0}
#bg svg{width:100%;height:100%;display:block}
#bg .drift{animation:drift 26s ease-in-out infinite alternate}
#bg .tw{animation:twinkle 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
#bg .d1{animation-delay:.9s}#bg .d2{animation-delay:1.7s}#bg .d3{animation-delay:.4s}
#bg .wave{animation:wave 4s ease-in-out infinite alternate}
#bg .petal{animation:fall 9s linear infinite;transform-box:fill-box}
@keyframes drift{to{transform:translateX(26px)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
@keyframes wave{to{transform:translateX(-18px)}}
@keyframes fall{from{transform:translate(0,-80px) rotate(0)}to{transform:translate(-90px,900px) rotate(540deg)}}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:520px;margin:0 auto;
  padding-top:calc(env(safe-area-inset-top) + 6px)}
header{display:flex;align-items:center;gap:8px;padding:6px 12px 8px}
button{font-family:inherit;color:var(--ink);cursor:pointer;touch-action:manipulation}
.iconbtn{width:46px;height:46px;flex:none;border-radius:16px;border:3px solid #fff;background:linear-gradient(var(--c1),var(--c2));
  box-shadow:0 4px 0 var(--csh),0 8px 14px rgba(0,0,0,.14);font-size:22px;padding:0}
.iconbtn:active,.tool:active{transform:translateY(3px);box-shadow:0 1px 0 var(--csh)}
.score{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:54px;
  background:linear-gradient(var(--c1),var(--c2));border:4px solid var(--frame);border-radius:20px;
  box-shadow:0 4px 0 var(--frame-d),0 8px 16px rgba(0,0,0,.16);overflow:hidden}
.score small{font-size:11px;line-height:1.2;color:var(--label);letter-spacing:.3px;white-space:nowrap;max-width:100%;padding:0 6px;
  overflow:hidden;text-overflow:ellipsis}
.score b{font-size:26px;line-height:1.05;font-weight:400;color:var(--num);text-shadow:0 2px 0 var(--numsh);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.nextbox{flex:none;width:54px;height:54px;border-radius:18px;background:linear-gradient(#fffdf7,#fff0f5);border:3px solid #ffd0df;
  box-shadow:0 4px 0 #eaa0b9,0 8px 14px rgba(200,90,130,.18);position:relative;display:flex;align-items:center;justify-content:center}
.nextbox span{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:10px;background:var(--pink);color:#fff;
  border-radius:8px;padding:1px 6px;letter-spacing:.5px;box-shadow:0 2px 0 #e0668f}
.nextbox canvas{width:46px;height:46px;display:block}
.coin{flex:none;display:flex;align-items:center;gap:5px;background:linear-gradient(var(--a1),var(--a2));color:#fff;border-radius:999px;
  padding:4px 12px 4px 4px;box-shadow:0 4px 0 var(--ash),0 8px 14px rgba(0,0,0,.18);min-width:80px;font-size:17px;border:2px solid #fff;
  text-shadow:0 1px 0 rgba(0,0,0,.15);white-space:nowrap;font-variant-numeric:tabular-nums}
.coin i{width:26px;height:26px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#f5a700);border:2px solid #fff;display:block;
  box-shadow:inset 0 -2px 0 #d48a00}
.coin.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.2)}}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#game{touch-action:none;display:block;filter:drop-shadow(0 12px 16px rgba(0,0,0,.2))}
footer{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:8px 14px calc(env(safe-area-inset-bottom) + var(--gap))}
.grp{display:flex;gap:10px}
.tool{width:72px;height:64px;border-radius:22px;border:3px solid #fff;background:linear-gradient(var(--c1),var(--c2));
  box-shadow:0 5px 0 var(--csh),0 10px 16px rgba(0,0,0,.18);display:flex;flex-direction:column;padding:0;
  align-items:center;justify-content:center;font-size:12px;gap:2px;white-space:nowrap}
.tool .ic{font-size:25px;line-height:1}
.tool .cost{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--ash)}
.tool .cost i{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#f5a700);display:block}
.tool.pink{background:linear-gradient(#fff6f9,#ffdbe7);box-shadow:0 5px 0 #eaa0b9,0 10px 16px rgba(200,90,130,.2);color:#c2456f}
.tool.active{background:linear-gradient(#fff6c8,#ffe27a);box-shadow:0 5px 0 #d6a800}
.tool.spin .ic{animation:spin .5s}
@keyframes spin{to{transform:rotate(360deg) scale(1.1)}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + var(--gap) + 90px);transform:translateX(-50%);
  background:var(--toast);color:#fff;padding:10px 18px;border-radius:16px;font-size:15px;opacity:0;transition:opacity .25s;
  pointer-events:none;white-space:nowrap;z-index:30}
#toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(40,30,30,.42);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
  display:none;align-items:center;justify-content:center;z-index:20;
  padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 14px)}
.modal.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.card{background:var(--cream);border-radius:28px;border:5px solid var(--frame);width:100%;max-width:420px;max-height:100%;
  display:flex;flex-direction:column;overflow:hidden;text-align:center;box-shadow:0 8px 0 var(--frame-d),0 20px 40px rgba(0,0,0,.25);
  animation:pop .25s cubic-bezier(.2,1.4,.5,1)}
@keyframes pop{from{transform:scale(.85)}}
.card-head{position:relative;flex:none;padding:16px 56px 12px;
  background:repeating-linear-gradient(90deg,var(--h1) 0 18px,var(--h2) 18px 36px);border-bottom:3px dashed var(--hline)}
.card-head h2{margin:0;font-size:24px;font-weight:400;text-shadow:0 2px 0 #fff}
.close{position:absolute;right:10px;top:9px;width:42px;height:42px;border-radius:50%;border:3px solid #fff;padding:0;
  background:linear-gradient(#ffa3c0,#ff7fa6);color:#fff;font-size:20px;line-height:1;box-shadow:0 3px 0 #d9608a}
.close:active{transform:translateY(2px);box-shadow:0 1px 0 #d9608a}
.card-body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;padding:8px 14px 18px}
.card p{margin:6px 0}
.sub{font-size:14px;color:var(--sub)}
.big{font-size:52px;color:var(--num);text-shadow:0 3px 0 var(--numsh)}
.btn{border:3px solid #fff;border-radius:18px;background:linear-gradient(var(--a1),var(--a2));color:#fff;font-size:19px;
  padding:12px 30px;box-shadow:0 5px 0 var(--ash);margin-top:14px;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ash)}
.btn.gray{background:linear-gradient(var(--c1),var(--c2));color:var(--ink);box-shadow:0 5px 0 var(--csh);text-shadow:none}
.dex{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;text-align:left;margin-top:8px}
.dex .it{display:flex;gap:8px;align-items:center;background:#fff;border-radius:16px;padding:6px 8px;min-width:0;
  box-shadow:0 3px 0 rgba(0,0,0,.08);border:2px solid rgba(255,255,255,.8)}
.dex canvas{width:54px;height:54px;flex:none}
.dex b{font-size:16px;font-weight:400;display:block}
.dex small{font-size:11.5px;color:var(--sub);line-height:1.3;display:block;font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
.dex .no{font-size:11px;color:#e09a00}
.stat{display:flex;justify-content:center;gap:10px;margin-top:6px}
.stat div{background:#fff;border-radius:14px;padding:6px 14px;box-shadow:0 3px 0 rgba(0,0,0,.08);font-size:14px}
.stat b{display:block;font-size:20px;font-weight:400;color:var(--a2)}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--page);z-index:40}

/* 작은 화면(아이폰 SE·미니 등): 위아래를 줄여 게임 통을 크게 */
@media (max-width:380px){
  header{gap:6px;padding:6px 8px 8px}
  .iconbtn{width:42px;height:42px;font-size:20px;border-radius:14px}
  .nextbox{width:48px;height:48px;border-radius:16px}
  .nextbox canvas{width:40px;height:40px}
  .score{height:50px;border-width:3px;border-radius:18px}
  .score b{font-size:23px}
  .score small{font-size:10px}
  .coin{min-width:0;font-size:15px;padding:3px 9px 3px 3px;gap:4px}
  .coin i{width:22px;height:22px}
  footer{padding-left:10px;padding-right:10px}
  .grp{gap:8px}
  .tool{width:64px}
  .dex{grid-template-columns:1fr}
}
@media (max-height:740px){
  :root{--gap:28px}
  #app{padding-top:calc(env(safe-area-inset-top) + 2px)}
  header{padding-top:4px;padding-bottom:6px}
  footer{padding-top:4px}
  .tool{height:54px;border-radius:18px;font-size:11px;gap:1px}
  .tool .ic{font-size:21px}
  .tool .cost{font-size:11px}
}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div id="app">
  <header>
    <button class="iconbtn" id="btnRestart" aria-label="다시 시작">↻</button>
    <div class="score"><small>BEST <span id="best">0</span></small><b id="score">0</b></div>
    <div class="nextbox"><span>NEXT</span><canvas id="next" width="96" height="96"></canvas></div>
    <div class="coin" id="coinPill"><i></i><span id="coins">0</span></div>
  </header>
  <div id="stage"><canvas id="game"></canvas></div>
  <footer>
    <div class="grp">
      <button class="tool pink" id="btnDex"><span class="ic">📖</span>과일도감</button>
      <button class="tool" id="btnTheme"><span class="ic">🎨</span>테마</button>
    </div>
    <div class="grp">
      <button class="tool" id="btnBomb"><span class="ic">💣</span><span class="cost"><i></i>20</span></button>
      <button class="tool" id="btnShake"><span class="ic">🌀</span><span class="cost"><i></i>20</span></button>
    </div>
  </footer>
</div>

<div class="modal" id="overModal"><div class="card">
  <div class="card-head"><h2>게임 오버!</h2></div>
  <div class="card-body">
    <p class="sub">이번 점수</p><div class="big" id="ovScore">0</div>
    <div class="stat"><div>최고 점수<b id="ovBest">0</b></div><div>획득 코인<b id="ovCoins">0</b></div></div>
    <button class="btn" id="btnAgain">다시 하기</button>
  </div>
</div></div>

<div class="modal" id="dexModal"><div class="card">
  <div class="card-head"><h2>📖 과일도감</h2><button class="close" id="btnDexX" aria-label="닫기">✕</button></div>
  <div class="card-body scroll">
    <p class="sub">같은 과일 두 개가 닿으면 다음 과일로!<br>모양마다 구르는 방식이 달라요.</p>
    <div class="dex" id="dexList"></div>
    <button class="btn gray" id="btnDexClose">닫기</button>
  </div>
</div></div>

<div id="toast"></div>
<div id="err">물리 엔진을 불러오지 못했어요.<br>새로고침 해 주세요.</div>

<script src="matter.min.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
<script>
(() => {
if (!window.Matter) { document.getElementById('err').style.display = 'flex'; return; }
const { Engine, Bodies, Body, Composite, Events, Vertices, Query } = Matter;

// ---------- 월드 상수 ----------
// 통 높이는 처음 켤 때 화면 비율에 맞춘다(작은 폰은 낮게, 긴 폰은 높게). 폭은 항상 400.
const W = 400, stageEl = document.getElementById('stage');
const H = Math.round(Math.max(540, Math.min(720, W * stageEl.clientHeight / Math.max(1, stageEl.clientWidth))));
const WALL = 14, FLOOR = H - 16, DROP_Y = 70, DANGER_Y = 128;
const STEP = 1000 / 60, DROP_COOLDOWN = 550, OVER_TIME = 2200;
const ITEM_COST = 20, COIN_MAKE_MAX = 10, COIN_POP_MAX = 30;

// 과일 정의: 모양(shape)이 물리 거동을 결정한다
const FRUITS = [
  { name: '블루베리', r: 15, shape: 'circle',  c: '#6C7BEA', d: '#3B47A0', desc: '동그라미 · 데굴데굴 잘 굴러가요', fs: .62 },
  { name: '딸기',     r: 21, shape: 'tri',     c: '#FF5A6E', d: '#B82838', desc: '역삼각형 · 뾰족한 끝이 틈새에 콕 끼어요', pat: 'seeds', leaf: 'crown', fs: .5 },
  { name: '포도',     r: 27, shape: 'hex',     c: '#A56BEA', d: '#6A35B0', desc: '육각형 · 살짝 구르다 딱 멈춰요', pat: 'grape', leaf: 'stem', fs: .56 },
  { name: '귤',       r: 34, shape: 'circle',  c: '#FFA62B', d: '#D27300', desc: '동그라미 · 멀리까지 굴러가요', pat: 'pores', leaf: 'leaf', fs: .6 },
  { name: '레몬',     r: 41, shape: 'ellipse', c: '#FFE34F', d: '#C9A200', desc: '타원 · 옆으로 눕고 뒤뚱거려요', pat: 'pores', leaf: 'leaf', fs: .55 },
  { name: '풋사과',   r: 48, shape: 'rsquare', c: '#97DC5A', d: '#4E9A1E', desc: '네모 · 구르지 않고 차곡차곡 쌓여요', leaf: 'stem', fs: .56 },
  { name: '바나나',   r: 56, shape: 'capsule', c: '#FFD93D', d: '#C29A00', desc: '길쭉이 · 기울면 미끄러져 내려가요', pat: 'banana', fs: .4 },
  { name: '배',       r: 64, shape: 'drop',    c: '#EEDB8E', d: '#B0963A', desc: '물방울 · 아래가 무거워 오뚝이처럼 서요', pat: 'pores', leaf: 'stem', fs: .5 },
  { name: '파인애플', r: 73, shape: 'tallOct', c: '#F7B73B', d: '#B97E12', desc: '길쭉 팔각 · 세워지면 기우뚱 쓰러져요', pat: 'grid', leaf: 'crown', fs: .5 },
  { name: '멜론',     r: 84, shape: 'deca',    c: '#B8E47E', d: '#6FA83A', desc: '십각형 · 묵직하게 천천히 굴러요', pat: 'net', leaf: 'stem', fs: .5 },
  { name: '수박',     r: 98, shape: 'circle',  c: '#3FBF55', d: '#1E7A30', desc: `최종 과일 · 만들면 코인 +${COIN_MAKE_MAX}, 두 개를 합치면 +${COIN_POP_MAX}!`, pat: 'stripes', fs: .5 },
];
const MAX = FRUITS.length - 1;
const SCORE = FRUITS.map((_, i) => (i + 1) * (i + 2) / 2);
const DROP_WEIGHTS = [30, 26, 20, 14, 10];

// 무늬용 고정 난수
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
FRUITS.forEach(F => { F.dots = Array.from({ length: 14 }, () => [rnd() * 2 - 1, rnd() * 2 - 1]); });

// ---------- 저장 ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('sf_' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('sf_' + k, JSON.stringify(v)); } catch {} },
};
let coins = store.get('coins', 100), best = store.get('best', 0), seen = store.get('seen', 4);

// ---------- 테마 ----------
// css: 화면 색(CSS 변수), box: 캔버스 통 모양, bg: 배경 그림(SVG)
const SVG_HEAD = '<svg viewBox="0 0 400 860" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">';
const CLOUD = '<g id="cl"><circle cx="0" cy="0" r="16"/><circle cx="18" cy="-10" r="21"/><circle cx="40" cy="-2" r="17"/><circle cx="58" cy="4" r="12"/><rect x="0" y="0" width="58" height="16" rx="8"/></g>';
const SPARK = '<path id="sp" d="M0-6C1-1 1-1 6 0C1 1 1 1 0 6C-1 1-1 1-6 0C-1-1-1-1 0-6Z"/>';
const grad = (id, stops, v = true) => `<linearGradient id="${id}" x1="0" y1="0" x2="${v ? 0 : 1}" y2="${v ? 1 : 0}">${stops.map((c, i) => `<stop offset="${i / (stops.length - 1)}" stop-color="${c}"/>`).join('')}</linearGradient>`;
const glow = (id, c) => `<radialGradient id="${id}"><stop offset="0" stop-color="${c}" stop-opacity=".95"/><stop offset=".35" stop-color="${c}" stop-opacity=".4"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`;

const THEMES = [
  {
    id: 'farm', name: '과일 농장', meta: '#7cc8f8',
    css: {},
    box: {
      wood: ['#F7D29C', '#EBB46E', '#D3954F'], line: '#A86B32', grain: 'rgba(150,90,40,.28)',
      knob: ['#6CC25A', '#3F8F33'], leaf: '#8FDC6E',
      glass: ['rgba(240,250,255,.72)', 'rgba(215,240,255,.86)', 'rgba(255,240,215,.92)'], shine: .5,
    },
    bg: () => `${SVG_HEAD}<defs>${grad('sky', ['#7cc8f8', '#c4ebff', '#fff0d2', '#ffe2c2'])}${glow('gl', '#fff2a8')}
      ${grad('h1', ['#c9ecb4', '#a8dc93'])}${grad('h2', ['#9fdc84', '#7fca68'])}${grad('h3', ['#82cf63', '#5fb84a'])}${CLOUD}${SPARK}
      <g id="tr"><rect x="-3" y="0" width="6" height="18" rx="3" fill="#a8743f"/><circle r="17" fill="#6cc25a"/><circle cx="-9" cy="-6" r="10" fill="#7fd06a"/>
      <circle cx="6" cy="-4" r="3.2" fill="#ff6b6b"/><circle cx="-6" cy="5" r="3.2" fill="#ffb03b"/><circle cx="9" cy="7" r="3.2" fill="#ff6b6b"/></g></defs>

// ---------- 상태 ----------

// ---------- 효과 ----------

// ---------- 합치기 ----------
function onCollide(e) {

    if (!fruits.includes(a) || !fruits.includes(b)) continue;
    removeFruit(a); removeFruit(b);
    const lv = a.level, F = FRUITS[lv];
    let mx = (a.position.x + b.position.x) / 2, my = (a.position.y + b.position.y) / 2;
    burst(mx, my, F.c, 10 + lv * 2);
    if (lv === MAX) {
      addCoins(COIN_POP_MAX, mx, my); addScore(SCORE[MAX] * 3);
      burst(mx, my, '#F5C400', 40); tone(523, .15, 'triangle', .2); setTimeout(() => tone(784, .3, 'triangle', .2), 120); buzz(60);
      continue;
    }
    const n = makeBody(lv + 1, 0, 0);
    mx = Math.max(WALL + n.halfW, Math.min(W - WALL - n.halfW, mx));
    my = Math.min(FLOOR - n.halfH, my);
    Body.setPosition(n, { x: mx, y: my }); Body.setAngle(n, a.angle);
    Body.setVelocity(n, { x: (a.velocity.x + b.velocity.x) / 2, y: Math.min(0, (a.velocity.y + b.velocity.y) / 2) });
    addFruit(n); addScore(SCORE[lv + 1]); discover(lv + 1);
    texts.push({ x: mx, y: my - 10, t: '+' + SCORE[lv + 1], life: 800, max: 800, c: '#fff', size: 18 });
    tone(260 + lv * 55, .14, 'sine', .16, 1.6); buzz(15);

// ---------- 입력 ----------
const toWorld = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / SC, y: (e.clientY - r.top) / SC }; };

function drop() {

  addFruit(b);
  tone(420, .07, 'sine', .08, .7);
  cur = next; next = randLevel(); nextDropAt = now + DROP_COOLDOWN;
  dropX = clampX(dropX);

}

function bombAt(p) {

  if (!hit) { toast('터뜨릴 과일을 탭하세요'); return; }
  removeFruit(hit); addCoins(-ITEM_COST);
  burst(hit.position.x, hit.position.y, FRUITS[hit.level].c, 30); burst(hit.position.x, hit.position.y, '#555', 12);
  tone(120, .25, 'sawtooth', .18, .5); buzz(40);

$('btnBomb').onclick = () => {

};

};
let shakeT = 0;

$('btnRestart').onclick = () => {

};

$('btnDex').onclick = openDex;

// iOS: 화면 전체가 끌려 다니거나 확대되지 않게 막되, 도감 목록 스크롤은 허용

// ---------- 루프 ----------
function checkOver(dt, now) {
  let warn = 0;
  for (const b of fruits) {
    if (b.position.y > H + 200) { removeFruit(b); continue; }
    if (now - b.born < 1300) continue;

const BOX_TOP = 92;
// 통 안 물방울 장식: [x, 통 높이 대비 위치, 반지름]

  ctx.setTransform(SC * DPR, 0, 0, SC * DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (shakeT > 0) ctx.translate((Math.random() - .5) * 6, (Math.random() - .5) * 6);
  const B = theme.box;

  // 유리 통
  ctx.save();
  rr(ctx, WALL, BOX_TOP, W - WALL * 2, FLOOR - BOX_TOP + 4, 16);
  const bg = ctx.createLinearGradient(0, BOX_TOP, 0, FLOOR);
  bg.addColorStop(0, B.glass[0]); bg.addColorStop(.6, B.glass[1]); bg.addColorStop(1, B.glass[2]);
  ctx.fillStyle = bg; ctx.fill(); ctx.clip();
  ctx.fillStyle = `rgba(255,255,255,${B.shine})`;
  for (const [bx, f, br] of BUBBLES) { ctx.beginPath(); ctx.arc(bx, BOX_TOP + f * (FLOOR - BOX_TOP), br, 0, 7); ctx.fill(); }
  ctx.fillStyle = `rgba(255,255,255,${B.shine + .05})`; rr(ctx, WALL + 8, BOX_TOP + 14, 9, FLOOR - BOX_TOP - 40, 5); ctx.fill();
  rr(ctx, WALL + 22, BOX_TOP + 14, 4, (FLOOR - BOX_TOP) * .7, 2); ctx.fill();
  ctx.restore();

  // 기둥과 바닥
  plank(ctx, 0, BOX_TOP - 4, WALL, H - BOX_TOP + 4, 7, true);
  plank(ctx, W - WALL, BOX_TOP - 4, WALL, H - BOX_TOP + 4, 7, true);
  plank(ctx, 0, FLOOR, W, H - FLOOR, 8, false);
  ctx.fillStyle = B.line;
  for (const x of [WALL + 10, W / 2, W - WALL - 10]) { ctx.beginPath(); ctx.arc(x, FLOOR + (H - FLOOR) / 2, 2, 0, 7); ctx.fill(); }
  knob(ctx, WALL / 2, BOX_TOP - 8); knob(ctx, W - WALL / 2, BOX_TOP - 8);

  // 경고선
  const pulse = danger > 0 ? .5 + .5 * Math.sin(now / 90) : 0;
  ctx.save(); ctx.setLineDash([10, 8]); ctx.lineWidth = 3;
  ctx.strokeStyle = danger > 0 ? `rgba(255,60,80,${.5 + pulse * .5})` : 'rgba(255,120,140,.45)';
  ctx.beginPath(); ctx.moveTo(WALL, DANGER_Y); ctx.lineTo(W - WALL, DANGER_Y); ctx.stroke(); ctx.restore();

  // 떨어뜨릴 과일 + 가이드
  if (state === 'play' && !bombMode) {
    const ready = now >= nextDropAt, x = clampX(dropX);
    ctx.save(); ctx.setLineDash([6, 7]); ctx.strokeStyle = 'rgba(230,120,200,.7)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, DROP_Y + TEMPL[cur].halfH); ctx.lineTo(x, FLOOR); ctx.stroke(); ctx.restore();
    ctx.globalAlpha = ready ? 1 : .35;
    drawTemplate(ctx, cur, x, DROP_Y, 1, -1);
    ctx.globalAlpha = 1;
  }

  // 과일
  for (const b of fruits) {
    const age = now - b.born, s = age < 200 ? .75 + .25 * (1 - Math.pow(1 - age / 200, 3)) : 1;
    drawFruit(ctx, b, now, s);
  }

  // 효과
  for (const p of fx) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts) {
    const k = t.life / t.max; ctx.globalAlpha = Math.min(1, k * 2);
    ctx.font = `${t.size}px Jua,"Malgun Gothic",sans-serif`; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(43,58,85,.8)';
    ctx.strokeText(t.t, t.x, t.y); ctx.fillStyle = t.c; ctx.fillText(t.t, t.x, t.y);
  }
  ctx.globalAlpha = 1;

  if (bombMode) {
    ctx.fillStyle = 'rgba(40,20,20,.18)'; rr(ctx, WALL, BOX_TOP, W - WALL * 2, FLOOR - BOX_TOP, 16); ctx.fill();
    ctx.font = '20px Jua,"Malgun Gothic",sans-serif'; ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.fillStyle = '#C0392B';
    ctx.strokeText('💣 터뜨릴 과일을 탭하세요', W / 2, 70); ctx.fillText('💣 터뜨릴 과일을 탭하세요', W / 2, 70);
  }
}

function updateFx(dt) {
  const k = dt / 16.67;
  for (const p of fx) { p.x += p.vx * k; p.y += p.vy * k; p.vy += .18 * k; p.life -= dt; }
  fx = fx.filter(p => p.life > 0);
  for (const t of texts) { t.y -= .6 * k; t.life -= dt; }
  texts = texts.filter(t => t.life > 0);
  if (shakeT > 0) shakeT -= dt;
}

let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(100, now - last); last = now;
  if (state === 'play') {
    acc += dt; let n = 0;
    while (acc >= STEP && n < 4) { Engine.update(engine, STEP); processMerges(); acc -= STEP; n++; }
    if (n === 4) acc = 0;
    if (state === 'play') checkOver(dt, now);
  }
  updateFx(dt); render(now);
  requestAnimationFrame(frame);
}

// 개발용 접근(검증 시 사용)
window.__game = { get fruits() { return fruits; }, makeBody, addFruit, FRUITS, get state() { return state; } };

resize(); restart(); requestAnimationFrame(frame);
})();
</script>
